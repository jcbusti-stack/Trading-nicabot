name: Ballenas Historico 14 Dias

on:
  workflow_dispatch:

jobs:
  run-ballenas-historico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar ballenas historico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python ballenas_historico.py
