name: Actualizar Cartera

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run main script
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_SECRET_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
        run: python main.py

      - name: Actualizar portafolio de acciones
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_SECRET_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python acciones.py
