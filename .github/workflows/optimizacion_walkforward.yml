name: Optimizacion Walk-Forward (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest largo + walk-forward (no toca config; ver artefacto)
        run: python -m nicabot.optimizacion
      - uses: actions/upload-artifact@v4
        with:
          name: optimizacion
          path: reportes/
