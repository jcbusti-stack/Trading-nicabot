name: Backtesting Filtro Volumen

on:
  workflow_dispatch:

jobs:
  run-backtesting-volumen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar backtesting de volumen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python backtesting_volumen.py
