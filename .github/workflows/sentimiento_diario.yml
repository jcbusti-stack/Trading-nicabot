name: Sentimiento Diario Claude

on:
  schedule:
    # Mexico (CDMX) no usa horario de verano desde 2022, se mantiene en UTC-6 todo el año.
    # 4:00 AM y 4:00 PM CDMX = 10:00 y 22:00 UTC
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sentimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar agente de sentimiento con Claude
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agente_sentimiento_claude.py

      - name: Ejecutar escaner de oportunidades
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python escaner_oportunidades.py

      - name: Ejecutar agente de ballenas (BTC y ETH)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python ballenas.py

      - name: Ejecutar agente verificador (revision cruzada)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agente_verificador.py

      - name: Ejecutar agente de memoria y precision
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python agente_memoria.py
