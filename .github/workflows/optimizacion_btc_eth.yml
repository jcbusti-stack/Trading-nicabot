name: Optimizacion BTC ETH

on:
  workflow_dispatch:

jobs:
  run-optimizacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar optimizacion BTC y ETH
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python optimizacion_btc_eth.py
