name: Grid Trading Multi-Activo

on:
  workflow_dispatch:

jobs:
  run-grid-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar grid trading multi-activo
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python grid_trading_multi.py
