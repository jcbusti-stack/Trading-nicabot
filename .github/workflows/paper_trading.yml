name: Paper Trading SOL

on:
  schedule:
    # Mexico (CDMX) no usa horario de verano desde 2022, se mantiene en UTC-6 todo el año.
    # 4:00 AM y 4:00 PM CDMX = 10:00 y 22:00 UTC
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python bot_paper.py

      - name: Calcular gestion de riesgo
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python gestion_riesgo.py

      - name: Commit result to repo
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@trading.local"
          git add estado.json
          git diff --quiet --cached || git commit -m "Actualizar estado paper trading"
          git push
