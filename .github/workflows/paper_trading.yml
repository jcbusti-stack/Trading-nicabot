name: Paper Trading SOL

on:
  schedule:
    # Corre 4 veces al dia, alineado a hora de Ciudad de Mexico (UTC-6 todo el ano):
    # 06:00 UTC = 12:00 AM CDMX | 12:00 UTC = 6:00 AM CDMX
    # 18:00 UTC = 12:00 PM CDMX | 00:00 UTC = 6:00 PM CDMX
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python bot_paper.py

      - name: Calcular gestion de riesgo
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python gestion_riesgo.py

      - name: Commit result to repo
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@trading.local"
          git add estado.json
          git diff --quiet --cached || git commit -m "Actualizar estado paper trading"
          git push
