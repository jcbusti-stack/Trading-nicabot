name: Paper Trading SOL

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot_paper.py

      - name: Commit result to repo
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@trading.local"
          git add estado.json
          git diff --quiet --cached || git commit -m "Actualizar estado paper trading"
          git push
