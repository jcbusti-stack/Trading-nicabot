name: Paper Trading Multi-activo

on:
  schedule:
    # Mexico (CDMX) no usa horario de verano desde 2022, se mantiene en UTC-6 todo el año.
    # 2 min despues del cierre de cada vela de 12h de Kraken (00:00 y 12:00 UTC = 6:02 PM y 6:02 AM CDMX).
    # Va antes de la vigilancia (:07) porque GitHub solo deja UNA corrida pendiente por grupo de concurrencia.
    - cron: '17 0,12 * * *'   # minuto 17: evita la hora en punto, cuando GitHub retrasa o descarta crons
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-json   # compartido con vigilancia_stops.yml, reactivar_bot.yml y revision_mensual.yml
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Run bot (PAPER, sin dinero real)
        env:
          MODO: paper   # NO cambiar a live aqui: las ordenes reales estan desactivadas en CI a proposito
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python bot_paper.py

      - name: Calcular gestion de riesgo y veto de IA
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gestion_riesgo.py

      - name: Commit result to repo
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@trading.local"
          git add estado.json datos_velas/
          git diff --quiet --cached && exit 0
          git commit -m "Actualizar estado paper trading"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rechazado (intento $i), rebase y reintento..."
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
